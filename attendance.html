<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance | Acadivon</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
    <div class="logo">
        <img src="logo.png" alt="Acadivon Logo">
        <h1>ACADIVON</h1>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="attendance.html" class="active">Attendance</a>
        <a href="study.html">Study</a>
        <a href="login.html">Login</a>
    </nav>
</header>


<section class="attendance-page">

<h1>📊 Attendance Tracker</h1>

<div class="attendance-form">
    <input type="text" id="subject" placeholder="Subject Name">
    <input type="number" id="total" placeholder="Total Classes">
    <input type="number" id="attended" placeholder="Attended Classes">
    <button onclick="addAttendance()">Add</button>
</div>

<div class="attendance-table">
<table>
<thead>
<tr>
<th>Subject</th>
<th>Attended</th>
<th>Total</th>
<th>Percentage</th>
<th>Progress</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="attendanceData"></tbody>

</table>
</div>

</section>

<footer>
© 2026 Acadivon | College Project
</footer>

<script src="script.js"></script>
</body>
</html>
